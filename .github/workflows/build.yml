name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk GeekMusic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeekMusic
          path: GeekMusic.apk

      # A new versionName in app/build.gradle = a new release (tag is created automatically)
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          NOTES=$(awk -v v="## ${VERSION}" '$0 == v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "$TAG" GeekMusic.apk --target "$GITHUB_SHA" \
            -t "GeekMusic ${TAG}" -n "${NOTES:-Release ${TAG}}"
