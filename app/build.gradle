plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.maniimani.driveplay'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.maniimani.driveplay'
        minSdk 26
        targetSdk 28          // Android 9 — same as the head unit
        versionCode 5
        versionName '2.1.0'
    }

    // A fixed key committed to the repo, so every build (local or CI) is signed the
    // same way and new versions install as updates over old ones. This is a personal
    // sideloaded app, not a Play Store release key.
    signingConfigs {
        shared {
            storeFile file('driveplay.keystore')
            storePassword 'android'
            keyAlias 'driveplay'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
